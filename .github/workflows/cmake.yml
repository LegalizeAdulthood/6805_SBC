name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows CMake build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MAME
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $release = Invoke-RestMethod `
            -Uri https://api.github.com/repos/mamedev/mame/releases/latest `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^mame[0-9]+b_(x64|64bit)\.exe$' } |
            Select-Object -First 1

          if (-not $asset) {
            $assetNames = ($release.assets | ForEach-Object { $_.name }) -join ', '
            throw "Could not find a MAME x64 Windows binary in release $($release.tag_name). Assets: $assetNames"
          }

          $downloadPath = Join-Path $env:RUNNER_TEMP $asset.name
          $installDir = Join-Path $env:RUNNER_WORKSPACE 'mame'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $downloadPath

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip is required to extract the MAME binary package'
          }

          & $sevenZip x "-o$installDir" -y $downloadPath
          $sevenZipExitCode = $LASTEXITCODE
          if ($sevenZipExitCode -gt 1) {
            throw "7-Zip failed to extract $($asset.name) with exit code $sevenZipExitCode"
          }

          $mameCommand = Join-Path $installDir 'mame.exe'
          if (-not (Test-Path $mameCommand)) {
            $mameCommand = Get-ChildItem -Path $installDir -Recurse -Filter mame.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mameCommand) {
            throw "Extracted $($asset.name) did not contain mame.exe"
          }

          $mameDataDir = Split-Path -Parent $mameCommand
          "MAME_COMMAND=$mameDataDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run CMake workflow preset
        run: cmake --workflow --preset default
